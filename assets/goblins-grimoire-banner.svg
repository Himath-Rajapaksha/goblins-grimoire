<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-labelledby="banner-title banner-desc">
<title id="banner-title">Goblin's Grimoire</title>
<desc id="banner-desc">An engraved banner for Goblin's Grimoire, a field manual for the pentest and bug-bounty toolbox: 118 tools, 119 scenario files, and a research workflow for every command.</desc>
<defs>
  <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0e110c"/>
    <stop offset="1" stop-color="#090b08"/>
  </linearGradient>
  <radialGradient id="lamp" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#a9c86f" stop-opacity=".07"/>
    <stop offset=".55" stop-color="#a8854f" stop-opacity=".03"/>
    <stop offset="1" stop-color="#a8854f" stop-opacity="0"/>
  </radialGradient>
  <style>
    .title { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", serif; font-size: 50px; letter-spacing: 1.6px; fill: #ece3cd; font-weight: 400; }
    .sub { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", serif; font-size: 16px; fill: #b9bcaa; }
    .eyebrow, .strip, .meta { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .eyebrow { font-size: 10px; letter-spacing: 1.4px; fill: #a8854f; font-variant: small-caps; }
    .strip { font-size: 11px; letter-spacing: .3px; fill: #838b78; }
    .meta { font-size: 10.5px; letter-spacing: .2px; fill: #5f6757; }
    .hair { stroke: #3d3527; stroke-width: 1; fill: none; }
    .sweep { animation: spin 24s linear infinite; }
    .eye { animation: blink 8s ease-in-out infinite; }
    .glyph { fill: none; stroke: #8d7c58; stroke-width: 1.35; stroke-linecap: round; stroke-linejoin: round; opacity: .82; animation: kindle 24s linear infinite; }
    @keyframes spin { from { transform: rotate(-90deg); } to { transform: rotate(270deg); } }
    @keyframes blink { 0%, 88%, 100% { transform: scaleY(1); } 91% { transform: scaleY(.08); } 94% { transform: scaleY(1); } }
    @keyframes kindle { 0% { stroke: #a9c86f; opacity: 1; } 8% { stroke: #a9c86f; opacity: 1; } 14%, 100% { stroke: #8d7c58; opacity: .82; } }
    @media (prefers-reduced-motion: reduce) {
      .sweep, .eye, .glyph { animation: none !important; }
    }
  </style>
</defs>

